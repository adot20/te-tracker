<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Site Ledger</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#1d3a5f">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f5f1e7;--cd:#fffdf8;--ink:#1f232b;--mu:#767b87;--rail:#1d3a5f;--am:#b8740a;--line:#d8d0bc;--good:#1f7a4d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--cd:#1a2029;--ink:#eef1f7;--mu:#93a0c0;--rail:#8fb2e0;--am:#f0b348;--line:#333c4d;--good:#57e0a0;--bad:#ff8f86}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 -apple-system,system-ui,Roboto,sans-serif;font-variant-numeric:tabular-nums;
 padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:600px;margin:auto;padding:16px 14px 48px}
h1{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:4px 0 14px}
h2{font-size:23px;margin:2px 0 14px;font-weight:800;letter-spacing:-.01em}
.cd{background:var(--cd);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.cd{animation:none}}
input,select,button{font:inherit;color:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--cd);margin:0 0 9px;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
button{cursor:pointer;width:auto;font-weight:700}
button.p{background:var(--rail);color:#fff;border-color:var(--rail);width:100%;padding:13px;border-radius:10px;letter-spacing:.02em}
button.p:active{transform:scale(.99)}
.r{display:flex;gap:8px}.r>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 3px;letter-spacing:.02em}
.mu{color:var(--mu);font-size:13px}
a.b{color:var(--rail);cursor:pointer;font-weight:600;text-decoration:none}
.back{display:inline-block;margin-bottom:10px;font-size:14px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--am);outline-offset:1px}

/* home: boarding-pass trip stub */
.stub{display:flex;position:relative;cursor:pointer;padding:0;overflow:hidden}
.stub .main{flex:1;padding:14px;min-width:0}
.stub .tail{width:104px;flex-shrink:0;background:var(--rail);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:8px;position:relative;text-align:center}
.stub .tail::before{content:"";position:absolute;left:-7px;top:0;bottom:0;width:14px;
 background-image:radial-gradient(circle,var(--bg) 4.5px,transparent 4.6px);background-size:14px 15px;background-repeat:repeat-y}
.stub .amt{font-size:19px;font-weight:800}
.stub .amtlbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-top:2px}
.stub .dest{font-weight:700;font-size:16.5px;margin:0 0 3px}
.stub .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:6px}
.tag.out{background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am)}
.tag.in{background:color-mix(in srgb,var(--rail) 14%,transparent);color:var(--rail)}

/* ledger card */
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}
.ledger .row+.row{border-top:1px dashed var(--line)}
.ledger .net{font-size:24px;font-weight:800}
.pos{color:var(--good)}.neg{color:var(--bad)}
.headline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.headline .v{font-size:26px;font-weight:800}

/* expense receipt list */
.rc{position:relative;padding:11px 34px 11px 14px;border-radius:10px;background:var(--cd);border:1px solid var(--line);margin:0 0 8px;cursor:pointer}
.rc .top{display:flex;align-items:baseline;gap:6px}
.rc .desc{font-weight:600}
.rc .dots{flex:1;border-bottom:1px dotted var(--line);margin-bottom:4px;min-width:12px}
.rc .amt{font-weight:700;white-space:nowrap}
.rc .meta{color:var(--mu);font-size:12.5px;margin-top:2px}
.rc .warn{color:var(--am);font-size:12.5px;margin-top:2px;font-weight:600}
.rc .del{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
 color:var(--mu);padding:0;margin:0;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.rc:hover .del{color:var(--bad)}
.editing{outline:2px solid var(--am)}

.chk{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin:0 0 9px;background:var(--cd)}
.chk input{width:auto;margin:0}
.notice{background:color-mix(in srgb,var(--am) 12%,var(--cd));border:1px solid color-mix(in srgb,var(--am) 40%,var(--line));border-radius:9px;padding:10px 12px;font-size:13px;margin:0 0 12px;color:var(--ink)}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}
.formhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.formhead .cancel{font-size:13px;color:var(--mu);cursor:pointer}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),K='te_data_v2',
TRV=['Metro','Namo Bharat Metro','Auto','Rapido','Uber','Train','Bus','Other'],
FOOD=['Breakfast','Lunch','Dinner','Snacks','Food'],
PERSONAL=['Personal'],DESC=[...FOOD,...PERSONAL],
PAY={upi:'UPI',cc:'Credit card',cash:'Cash',metro:'Metro card'};
let D=JSON.parse(localStorage.getItem(K)||migrate()||'{"trips":[],"cust":{}}'),cur=null,eid=null,last={pay:'upi',date:''};
function migrate(){const o=localStorage.getItem('te_data');return o||null}
const save=()=>localStorage.setItem(K,JSON.stringify(D)),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN'),today=()=>new Date().toLocaleDateString('en-CA'),
diff=t=>t.start&&t.end?Math.round((new Date(t.end)-new Date(t.start))/864e5):0,
days=t=>t.days??Math.max(1,diff(t)),
desc=l=>DESC.includes(l.cat)?l.cat+(l.det?` — ${l.det}`:''):(l.from||l.to?`${l.cat}: ${l.from||'?'} → ${l.to||'?'}`:l.cat);

function calc(t){
 const out=t.type=='out',rows=[],foodByDay={};
 let savings=0,personal=0;
 [...t.lines].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(l=>{
  savings+=l.saved||0;
  const isFood=FOOD.includes(l.cat),isPers=PERSONAL.includes(l.cat);
  const excel=!(isPers||(out&&isFood));
  if(!excel)personal+=l.amt;
  if(!out&&isFood)foodByDay[l.date]=(foodByDay[l.date]||0)+l.amt;
  rows.push({l,excel});
 });
 let n=0;rows.forEach(r=>{if(r.excel)r.bill=r.l.pay=='cash'?'cash':(r.l.bill?++n:'')});
 const claim=rows.filter(r=>r.excel).reduce((s,r)=>s+r.l.amt,0),allow=out?550*days(t):0;
 const overDays=Object.entries(foodByDay).filter(([d,v])=>v>300).sort();
 return{rows,claim,allow,savings,personal,net:savings+allow-personal,overDays,total:claim+allow}}

function home(){cur=null;const has=D.trips.length;
 $('#app').innerHTML=`<h1>Site Ledger</h1>
 <button class=p onclick=nt()>+ New site visit</button>
 ${has?D.trips.slice().reverse().map(t=>{const c=calc(t);return`
  <div class="cd stub" onclick="op(${t.id})">
   <div class=main><div class=dest>${esc(t.customer||'Untitled visit')}</div>
    <div class=mu>${esc(t.dest||'No destination yet')}${t.start?' · '+t.start:''}</div>
    <span class="tag ${t.type}">${t.type=='out'?'Outstation':'In-city'}</span></div>
   <div class=tail><div class=amt>${inr(c.total)}</div><div class=amtlbl>Receivable</div></div>
  </div>`}).join(''):'<div class="cd empty">No site visits yet.<br>Add one before you leave.</div>'}
 <p class=mu style="text-align:center;margin-top:18px"><a class=b onclick=bk()>Back up data</a> &nbsp;·&nbsp; <a class=b onclick="$('#f').click()">Restore backup</a><input id=f type=file accept=.json hidden onchange=rs(event)></p>`}

function nt(){const t={id:Date.now(),customer:'',ips:'',dest:'',purpose:'',teNo:'',type:'in',start:today(),end:today(),days:null,lines:[]};D.trips.push(t);save();op(t.id)}

function op(id){cur=D.trips.find(t=>t.id==id);eid=null;const t=cur,
 I=(k,l,ty='text',x='')=>`<div><label>${l}</label><input ${x} type=${ty} value="${esc(t[k])}" oninput="S('${k}',this.value)"></div>`;
 $('#app').innerHTML=`<a class="b back" onclick=home()>‹ All visits</a><h2>${esc(t.customer||'New site visit')}</h2>
 <div class=cd>
  <div class=r>${I('customer','Customer','text','list=cl')}${I('ips','IPS number')}</div><datalist id=cl>${Object.keys(D.cust).map(c=>`<option>${esc(c)}`).join('')}</datalist>
  <div class=r>${I('dest','Destination')}${I('purpose','Purpose')}</div>
  <div class=r><div><label>Trip type</label><select onchange="S('type',this.value)">
   <option value=in ${t.type=='in'?'selected':''}>In-city (under 150 km)<option value=out ${t.type=='out'?'selected':''}>Outstation</select></div>
   ${I('teNo','TE number')}</div>
  <div class=r>${I('start','Start','date')}${I('end','End','date')}<div><label>Days</label><input type=number min=1 id=dy placeholder="${Math.max(1,diff(t))}" value="${t.days??''}" oninput="S('days',this.value===''?null:+this.value)"></div></div>
 </div>
 <div id=sum></div>
 <div class=cd>
  <div class=formhead><label style="margin:0">${eid?'Edit expense':'Add expense'}</label>${eid?'<span class=cancel onclick=cc()>Cancel</span>':''}</div>
  <select id=cat onchange=tg()>
   <optgroup label="Travel">${TRV.map(c=>`<option>${c}`).join('')}</optgroup>
   <optgroup label="Food">${FOOD.map(c=>`<option>${c}`).join('')}</optgroup>
   <optgroup label="Personal">${PERSONAL.map(c=>`<option>${c}`).join('')}</optgroup>
  </select>
  <input id=dt type=date value="${last.date||t.start}">
  <div class=r id=tr><input id=fr placeholder="From"><input id=to placeholder="To"></div>
  <input id=det placeholder="Details (optional)" hidden>
  <div class=r><input id=amt type=number min=0 inputmode=decimal placeholder="Bill amount ₹"><input id=sv type=number min=0 inputmode=decimal placeholder="Cashback/saved ₹"></div>
  <select id=pay>${Object.entries(PAY).map(([k,v])=>`<option value=${k} ${k==last.pay?'selected':''}>${v}`).join('')}</select>
  <div class=chk><input type=checkbox id=bl> <span>Bill attached</span></div>
  <button class=p id=ab onclick=al()>${eid?'Save changes':'Add expense'}</button>
 </div>
 <div id=ls></div>
 <button class=p onclick=xl()>Download TE Excel</button>
 <p style="text-align:center"><a class=b onclick=dt()>Delete this visit</a></p>`;tg();rf()}

function S(k,v){cur[k]=v;if(k=='customer'&&D.cust[v]){cur.ips=D.cust[v];op(cur.id);return}
 if(k=='ips'&&cur.customer)D.cust[cur.customer]=v;save();
 if(k=='type'){op(cur.id);return}
 if(['start','end','days'].includes(k))$('#dy').placeholder=Math.max(1,diff(cur));
 rf()}
function tg(){const d=DESC.includes($('#cat').value);$('#tr').hidden=d;$('#det').hidden=!d}
function cc(){eid=null;op(cur.id)}

function rf(){const t=cur,c=calc(t);
 $('#sum').innerHTML=`
 <div class=cd><div class=headline><span class=mu>You'll receive</span><span class=v>${inr(c.total)}</span></div>
  <div class=ledger>
   <div class=row><span class=mu>Excel claim</span><b>${inr(c.claim)}</b></div>
   ${t.type=='out'?`<div class=row><span class=mu>Outstation allowance (${days(t)} × ₹550)</span><b>${inr(c.allow)}</b></div>`:''}
  </div></div>
 <div class="cd ledger"><div class=headline><span class=mu>Personal ledger</span><span class="net ${c.net<0?'neg':'pos'}">${c.net<0?'−':''}${inr(Math.abs(c.net))}</span></div>
  <div class=row><span class=mu>Cashback &amp; discounts</span><b class=pos>+${inr(c.savings)}</b></div>
  ${t.type=='out'?`<div class=row><span class=mu>Outstation allowance</span><b class=pos>+${inr(c.allow)}</b></div>`:''}
  ${c.personal?`<div class=row><span class=mu>Personal spend (not in Excel)</span><b class=neg>−${inr(c.personal)}</b></div>`:''}
 </div>
 ${c.overDays.length?`<div class=notice>⚠ Food went over the ₹300 daily cap on ${c.overDays.map(([d,v])=>`${d} (${inr(v)})`).join(', ')}. It still exports at the full amount — just flagging it.</div>`:''}`;
 $('#ls').innerHTML=c.rows.length?c.rows.map(r=>{const l=r.l;
  return`<div class="rc${eid==l.id?' editing':''}" onclick="ed(${l.id})">
   <button class=del onclick="event.stopPropagation();dl(${l.id})" aria-label=Delete>×</button>
   <div class=top><span class=desc>${esc(desc(l))}</span><span class=dots></span><span class=amt>${inr(l.amt)}</span></div>
   <div class=meta>${l.date} · ${PAY[l.pay]}${r.bill?` · bill ${r.bill}`:''}${l.saved?` · saved ${inr(l.saved)}`:''}</div>
   ${!r.excel?`<div class=warn>${PERSONAL.includes(l.cat)?'Personal spend — in your ledger, not the Excel':'Outstation food — in your ledger, not the Excel'}</div>`:''}
  </div>`}).join(''):'<div class="cd empty">No expenses logged yet.</div>'}

function al(){const amt=+$('#amt').value;if(!(amt>0))return $('#amt').focus();
 const l={id:eid||Date.now(),date:$('#dt').value,cat:$('#cat').value,from:$('#fr').value.trim(),to:$('#to').value.trim(),det:$('#det').value.trim(),amt,saved:+$('#sv').value||0,pay:$('#pay').value,bill:$('#bl').checked};
 const i=cur.lines.findIndex(x=>x.id==l.id);i<0?cur.lines.push(l):cur.lines[i]=l;
 last={pay:l.pay,date:l.date};save();
 const wasEdit=!!eid,to=l.to;eid=null;
 $('#ab').textContent='Add expense';$('.formhead label').textContent='Add expense';
 const cf=document.querySelector('.formhead .cancel');if(cf)cf.remove();
 ['amt','sv','det','to'].forEach(k=>$('#'+k).value='');$('#fr').value=wasEdit?'':to;$('#bl').checked=false;
 rf()}
function ed(id){const l=cur.lines.find(x=>x.id==id);eid=id;
 $('#cat').value=l.cat;tg();$('#dt').value=l.date;$('#fr').value=l.from;$('#to').value=l.to;$('#det').value=l.det;
 $('#amt').value=l.amt;$('#sv').value=l.saved||'';$('#pay').value=l.pay;$('#bl').checked=l.bill;
 $('#ab').textContent='Save changes';const fh=document.querySelector('.formhead');fh.querySelector('label').textContent='Edit expense';
 if(!fh.querySelector('.cancel'))fh.insertAdjacentHTML('beforeend','<span class=cancel onclick=cc()>Cancel</span>');
 rf();document.querySelector('.rc.editing')?.scrollIntoView({block:'center',behavior:'smooth'});window.scrollTo({top:document.querySelector('.cd:nth-of-type(2)')?.offsetTop-8||0,behavior:'smooth'})}
function dl(id){if(eid==id){eid=null}cur.lines=cur.lines.filter(x=>x.id!=id);save();
 $('#ab').textContent='Add expense';const cf=document.querySelector('.formhead .cancel');if(cf)cf.remove();document.querySelector('.formhead label').textContent='Add expense';
 rf()}
function dt(){if(confirm('Delete this whole visit? This cannot be undone.')){D.trips=D.trips.filter(x=>x!=cur);save();home()}}
function bk(){dw(new Blob([JSON.stringify(D)]),`te-backup-${today()}.json`)}
function rs(e){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!d.trips)throw 0;D=d;save();home()}catch{alert('That file is not a valid backup.')}})}
function dw(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}

async function xl(){const t=cur,c=calc(t),U=s=>s?new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))):null,F='d-mmm-yy';
 try{const wb=new ExcelJS.Workbook();await wb.xlsx.load(await(await fetch('TE_format.xlsx')).arrayBuffer());const ws=wb.worksheets[0];
 const rows=c.rows.filter(r=>r.excel),x=Math.max(0,rows.length-20),a=31+x;
 if(x){['C31:D31','C32:D32','C33:D33','E32:F32','E33:F33'].forEach(m=>ws.unMergeCells(m));ws.spliceRows(31,0,...Array(x).fill([]));
  for(let i=0;i<x;i++)for(let k=1;k<=6;k++)ws.getRow(31+i).getCell(k).style={...ws.getRow(30).getCell(k).style};
  [`C${a}:D${a}`,`C${a+1}:D${a+1}`,`C${a+2}:D${a+2}`,`E${a+1}:F${a+1}`,`E${a+2}:F${a+2}`].forEach(m=>ws.mergeCells(m))}
 ws.getCell('C2').value=t.dest;ws.getCell('F2').value=t.purpose;ws.getCell('C3').value=t.customer;ws.getCell('C4').value=t.ips;ws.getCell('F4').value=days(t);
 ws.getCell('C5').value=U(t.start);ws.getCell('C5').numFmt=F;ws.getCell('F5').value=U(t.end);ws.getCell('F5').numFmt=F;ws.getCell('C6').value=t.teNo.trim();
 rows.forEach((r,i)=>{const R=ws.getRow(11+i);[1,2].forEach(k=>{R.getCell(k).value=U(r.l.date);R.getCell(k).numFmt=F});R.getCell(3).value=desc(r.l);R.getCell(4).value=r.bill||null;R.getCell(6).value=r.l.amt});
 ws.getCell(`E${a}`).value={formula:`SUM(E11:E${a-1})`,result:0};ws.getCell(`F${a}`).value={formula:`SUM(F11:F${a-1})`,result:c.claim};
 ws.getCell(`E${a+1}`).value={formula:`E${a}+F${a}`,result:c.claim};ws.getCell(`E${a+2}`).value={formula:`F${a}-C7`,result:c.claim};
 wb.calcProperties.fullCalcOnLoad=true;dw(new Blob([await wb.xlsx.writeBuffer()]),`TE_${(t.customer||'trip').replace(/\W+/g,'_')}_${t.start}.xlsx`)}
 catch(e){alert('Export failed: '+e.message+'\nOpen the app once with network so the Excel library and TE_format.xlsx get cached.')}}

home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
