<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Site Ledger</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#1d3a5f">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f5f1e7;--cd:#fffdf8;--ink:#1f232b;--mu:#767b87;--rail:#1d3a5f;--fill:#1d3a5f;--am:#b8740a;--line:#d8d0bc;--good:#1f7a4d;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--cd:#1a2029;--ink:#eef1f7;--mu:#93a0c0;--rail:#8fb2e0;--am:#f0b348;--line:#333c4d;--good:#57e0a0;--bad:#ff8f86}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 -apple-system,system-ui,Roboto,sans-serif;font-variant-numeric:tabular-nums;
 padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:600px;margin:auto;padding:16px 14px 48px}
h1{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:700;margin:4px 0 14px}
h2{font-size:23px;margin:2px 0 14px;font-weight:800;letter-spacing:-.01em}
.cd{background:var(--cd);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;animation:rise .3s ease both;position:relative}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.cd{animation:none}}
input,select,button{font:inherit;color:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--cd);margin:0 0 9px;-webkit-appearance:none}
input[type=date]{font-size:14px}
input::placeholder{font-size:14px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
button{cursor:pointer;width:auto;font-weight:700}
button.p{background:var(--fill);color:#fff;border-color:var(--fill);width:100%;padding:13px;border-radius:10px;letter-spacing:.02em}
button.p:active{transform:scale(.99)}
.r{display:flex;gap:8px}.r>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 3px;letter-spacing:.02em}
.mu{color:var(--mu);font-size:13px}
a.b{color:var(--rail);cursor:pointer;font-weight:600;text-decoration:none}
.back{display:inline-block;margin-bottom:10px;font-size:14px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--am);outline-offset:1px}

.stub{display:flex;position:relative;cursor:pointer;padding:0;overflow:hidden}
.stub .main{flex:1;padding:14px;min-width:0}
.stub .tail{width:104px;flex-shrink:0;background:var(--fill);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;position:relative;text-align:center}
.tail::before,.tbox::before{content:"";position:absolute;left:-7px;top:0;bottom:0;width:14px;
 background-image:radial-gradient(circle,var(--bg) 4.5px,transparent 4.6px);background-size:14px 15px;background-repeat:repeat-y}
.stub .amt{font-size:19px;font-weight:800}
.stub .amtlbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-top:2px}
.stub .dest{font-weight:700;font-size:16.5px;margin:0 0 3px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-top:6px}
.tag.out{background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am)}
.tag.in{background:color-mix(in srgb,var(--rail) 14%,transparent);color:var(--rail)}

.draftcard{border-style:dashed;border-color:var(--am);background:color-mix(in srgb,var(--am) 7%,var(--cd));cursor:pointer}
.draftrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.savebar{border-color:var(--am);background:color-mix(in srgb,var(--am) 9%,var(--cd))}
.savebar button.p{background:var(--am);border-color:var(--am)}

.twocol{display:flex;padding:0;overflow:hidden}
.twocol .main{flex:1;padding:14px;min-width:0}
.tbox{width:108px;flex-shrink:0;background:var(--fill);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;text-align:center;position:relative}
.tbox .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;opacity:.85;margin-bottom:5px}
.tbox .amt{font-size:19px;font-weight:800;color:#fff}
.tbox .sub{font-size:10.5px;opacity:.9;margin-top:4px}

.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;gap:10px}
.row+.row{border-top:1px dashed var(--line)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.headline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.headline .v{font-size:26px;font-weight:800}

.rc{position:relative;padding:11px 38px 11px 14px;border-radius:10px;background:var(--cd);border:1px solid var(--line);margin:0 0 8px;cursor:pointer}
.rc .top{display:flex;align-items:baseline;gap:6px}
.rc .desc{font-weight:600}
.rc .dots{flex:1;border-bottom:1px dotted var(--line);margin-bottom:4px;min-width:12px}
.rc .amt{font-weight:700;white-space:nowrap}
.rc .meta{color:var(--mu);font-size:12.5px;margin-top:2px}
.rc .warn{color:var(--am);font-size:12.5px;margin-top:2px;font-weight:600}
.editing{outline:2px solid var(--am)}
.kebab{position:absolute;top:4px;right:4px;width:30px;height:30px;border:none;background:transparent;color:var(--mu);font-size:18px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;border-radius:8px}
.kebab:hover,.kebab:focus-visible{background:var(--bg);color:var(--ink)}
.menu{background:var(--cd);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.2);overflow:hidden;z-index:50;min-width:134px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:none;border-radius:0;background:var(--cd);margin:0;font-size:13.5px;font-weight:600;text-align:left;color:var(--ink)}
.menu button+button{border-top:1px solid var(--line)}
.menu button.danger{color:var(--bad)}
.menu button:hover{background:var(--bg)}

label.chk{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin:0 0 9px;background:var(--cd);cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
label.chk input{position:absolute;opacity:0;width:0;height:0}
label.chk .box{width:21px;height:21px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;color:#fff;font-size:13px;font-weight:800}
label.chk input:checked~.box{background:var(--fill);border-color:var(--fill)}
label.chk input:checked~.box::after{content:"✓"}
label.chk:has(input:checked){border-color:var(--fill);background:color-mix(in srgb,var(--fill) 8%,var(--cd))}

.svhint{font-size:12px;margin:-5px 0 9px;min-height:15px}
.notice{background:color-mix(in srgb,var(--am) 12%,var(--cd));border:1px solid color-mix(in srgb,var(--am) 40%,var(--line));border-radius:9px;padding:10px 12px;font-size:13px;margin:0 0 12px;color:var(--ink)}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}
.formhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.formhead .cancel{font-size:13px;color:var(--mu);cursor:pointer}

/* floating action button */
main{padding-bottom:92px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0));width:58px;height:58px;border-radius:50%;
 background:var(--fill);color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;
 box-shadow:0 6px 18px rgba(0,0,0,.3);border:none;cursor:pointer;z-index:30;padding:0;margin:0}
.fab:active{transform:scale(.94)}

/* bottom sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,18,.45);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:40}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-radius:18px 18px 0 0;padding:10px 14px calc(16px + env(safe-area-inset-bottom,0));
 max-height:86vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:41;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:2px auto 12px}
@media(prefers-reduced-motion:reduce){.sheet,.backdrop{transition:none}}

/* pill toggle */
.pillgroup{display:flex;gap:8px;margin:0 0 4px}
.pill{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--cd);font-weight:700;color:var(--mu);font-size:14px}
.pill.active{background:var(--fill);color:#fff;border-color:var(--fill)}
.pillhint{font-size:11.5px;color:var(--mu);margin:0 0 9px}

.cicon{font-size:16px;flex-shrink:0;line-height:1}

/* view transitions: a soft horizontal slide between screens, not a plain crossfade */
::view-transition-old(root){animation:vt-out .22s ease both}
::view-transition-new(root){animation:vt-in .22s ease both}
@keyframes vt-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-14px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),K='te_data_v2',DK='te_draft_v1',
TRV=['Metro','Namo Bharat Metro','Auto','Rapido','Uber','Train','Bus','Customer vehicle'],
FOOD=['Breakfast','Lunch','Dinner','Snacks','Food'],
PERS=[['Personal','Personal'],['Grocery','Grocery'],['Pother','Other']],
PV=PERS.map(p=>p[0]),DESC=[...FOOD,...PV],
PAY={upi:'UPI',cc:'Credit card',cash:'Cash',metro:'Metro card'},
ICON={'Metro':'🚇','Namo Bharat Metro':'🚄','Auto':'🛺','Rapido':'🏍️','Uber':'🚕','Train':'🚆','Bus':'🚌','Customer vehicle':'🚗',
 'Breakfast':'🍳','Lunch':'🍱','Dinner':'🍽️','Snacks':'🍪','Food':'🍴','Personal':'🧴','Grocery':'🛒','Pother':'🏷️'},
icon=c=>ICON[c]||'💳';
function nav(fn){const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(document.startViewTransition&&!reduced)document.startViewTransition(fn);else fn()}
let D=JSON.parse(localStorage.getItem(K)||migrate()||'{"trips":[],"cust":{}}'),
 draft=JSON.parse(localStorage.getItem(DK)||'null'),cur=null,eid=null,last={pay:'upi',date:''};
function migrate(){return localStorage.getItem('te_data')}
const save=()=>localStorage.setItem(K,JSON.stringify(D)),
saveDraft=()=>{if(draft)localStorage.setItem(DK,JSON.stringify(draft))},
persist=()=>cur.saved===false?saveDraft():save(),
isEmptyDraft=t=>!t.customer&&!t.dest&&!t.purpose&&!t.teNo&&(!t.lines||!t.lines.length),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN'),today=()=>new Date().toLocaleDateString('en-CA'),
diff=t=>t.start&&t.end?Math.round((new Date(t.end)-new Date(t.start))/864e5):0,
days=t=>t.days??Math.max(1,diff(t)),
catLbl=c=>(PERS.find(p=>p[0]==c)||[0,c])[1],
desc=l=>DESC.includes(l.cat)?catLbl(l.cat)+(l.det?` — ${l.det}`:''):(l.from||l.to?`${l.cat} from ${l.from||'?'} to ${l.to||'?'}`:l.cat),
lineSaved=l=>Math.round(((l.eff!=null?l.amt-l.eff:(l.saved||0)))*100)/100;

function calc(t){
 const out=t.type=='out',rows=[],foodByDay={};
 let savings=0,personal=0;
 [...t.lines].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id).forEach(l=>{
  savings+=lineSaved(l);
  const isFood=FOOD.includes(l.cat),isPers=PV.includes(l.cat);
  const excel=!(isPers||(out&&isFood));
  if(!excel)personal+=l.amt;
  if(!out&&isFood)foodByDay[l.date]=(foodByDay[l.date]||0)+l.amt;
  rows.push({l,excel});
 });
 let n=0;rows.forEach(r=>{if(r.excel)r.bill=r.l.pay=='cash'?'cash':(r.l.bill?++n:'')});
 const claim=rows.filter(r=>r.excel).reduce((s,r)=>s+r.l.amt,0),allow=out?550*days(t):0;
 const overDays=Object.entries(foodByDay).filter(([d,v])=>v>300).sort();
 return{rows,claim,allow,savings,personal,net:savings+allow-personal,overDays,total:claim+allow}}

function home(){
 if(draft&&isEmptyDraft(draft)){draft=null;localStorage.removeItem(DK)}
 cur=null;const has=D.trips.length;
 $('#app').innerHTML=`<h1>Site Ledger</h1>
 ${draft?`<div class="cd draftcard" onclick="nav(()=>op(${draft.id}))">
   <div class=draftrow><div><b>${esc(draft.customer||'Unsaved visit')}</b>
     <div class=mu>${esc(draft.dest||'Draft — tap to continue')}</div></div>
    <a class=b onclick="event.stopPropagation();discardDraft()">Discard</a></div>
   <span class=tag style="background:color-mix(in srgb,var(--am) 18%,transparent);color:var(--am)">DRAFT · NOT SAVED</span></div>`:''}
 ${has?D.trips.slice().reverse().map(t=>{const c=calc(t);return`
  <div class="cd stub" onclick="nav(()=>op(${t.id}))">
   <div class=main><div class=dest>${esc(t.customer||'Untitled visit')}</div>
    <div class=mu>${esc(t.dest||'No destination yet')}${t.start?' · '+t.start:''}</div>
    <span class="tag ${t.type}">${t.type=='out'?'Outstation':'In-city'}</span></div>
   <div class=tail><div class=amt>${inr(c.total)}</div><div class=amtlbl>Receivable</div></div>
  </div>`}).join(''):(draft?'':'<div class="cd empty">No site visits yet.<br>Tap + to add one before you leave.</div>')}
 <p class=mu style="text-align:center;margin-top:18px"><a class=b onclick=bk()>Back up data</a> &nbsp;·&nbsp; <a class=b onclick="$('#f').click()">Restore backup</a><input id=f type=file accept=.json hidden onchange=rs(event)></p>
 <button class=fab onclick=nt() aria-label="New site visit">+</button>`}

function nt(){
 if(draft&&!isEmptyDraft(draft)){nav(()=>op(draft.id));return}
 draft={id:Date.now(),customer:'',ips:'',dest:'',purpose:'',teNo:'',type:'in',start:today(),end:today(),days:null,lines:[],saved:false};
 saveDraft();nav(()=>op(draft.id))}

function commitDraft(){if(!draft)return;draft.saved=true;D.trips.push(draft);save();localStorage.removeItem(DK);const id=draft.id;draft=null;op(id)}
function discardDraft(){draft=null;localStorage.removeItem(DK);if(cur&&cur.saved===false)cur=null;nav(home)}

function op(id){cur=(draft&&draft.id==id)?draft:D.trips.find(t=>t.id==id);eid=null;const t=cur,isDraft=t.saved===false,
 I=(k,l,ty='text',x='')=>`<div><label>${l}</label><input ${x} type=${ty} value="${esc(t[k])}" oninput="S('${k}',this.value)"></div>`;
 $('#app').innerHTML=`<a class="b back" onclick="nav(home)">‹ All visits</a><h2>${esc(t.customer||'New site visit')}</h2>
 ${isDraft?`<div class="cd savebar"><div class=mu style="margin-bottom:8px">Not saved yet — your entries are kept safely as a draft, but this won't appear in your visit list until you save it.</div><button class=p onclick=commitDraft()>✓ Save visit</button></div>`:''}
 <div class=cd>
  <div class=r>${I('customer','Customer','text','list=cl')}${I('ips','IPS number')}</div><datalist id=cl>${Object.keys(D.cust).map(c=>`<option>${esc(c)}`).join('')}</datalist>
  <div class=r>${I('dest','Destination')}${I('purpose','Purpose')}</div>
  <div><label>Trip type</label><div class=pillgroup>
   <button type=button class="pill${t.type=='in'?' active':''}" onclick="S('type','in')">In-city</button>
   <button type=button class="pill${t.type=='out'?' active':''}" onclick="S('type','out')">Outstation</button>
  </div><div class=pillhint>${t.type=='in'?'Under 150 km from Delhi':'Over 150 km from Delhi'}</div></div>
  <div class=r>${I('teNo','TE number')}</div>
  <div class=r>${I('start','Start','date')}${I('end','End','date')}</div>
  <div><label>Days</label><input type=number min=1 id=dy placeholder="${Math.max(1,diff(t))}" value="${t.days??''}" oninput="S('days',this.value===''?null:+this.value)"></div>
 </div>
 <div id=sum></div>
 <div id=ls></div>
 <button class=p onclick=xl()>Download TE Excel</button>
 <p style="text-align:center"><a class=b onclick=dt()>${isDraft?'Discard draft':'Delete this visit'}</a></p>
 <button class=fab onclick=openSheet() aria-label="Add expense">+</button>
 <div class=backdrop id=backdrop onclick=closeSheet()></div>
 <div class=sheet id=sheet>
  <div class=sheet-handle></div>
  <div class=formhead><label style="margin:0" id=sheetTitle>Add expense</label><span class=cancel onclick=closeSheet()>✕</span></div>
  <select id=cat onchange=tg()>
   <optgroup label="Travel">${TRV.map(c=>`<option>${c}`).join('')}</optgroup>
   <optgroup label="Food">${FOOD.map(c=>`<option>${c}`).join('')}</optgroup>
   <optgroup label="Personal">${PERS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</optgroup>
  </select>
  <input id=dt type=date value="${last.date||t.start}" oninput="if(!$('#md').checked)$('#dt2').value=this.value">
  <label class=chk><input type=checkbox id=md onchange=toggleMd()><span class=box></span><span>Spans multiple days (long train journeys)</span></label>
  <div id=dt2wrap hidden><label>Arrival date</label><input id=dt2 type=date></div>
  <div class=r id=tr><input id=fr placeholder="From"><input id=to placeholder="To"></div>
  <input id=det placeholder="Details (optional)" hidden>
  <div class=r><input id=amt type=number min=0 inputmode=decimal placeholder="Bill amount ₹ (blank = free)" oninput=svhint()><input id=eff type=number min=0 inputmode=decimal placeholder="Effective cost ₹" oninput=svhint()></div>
  <div id=svh class=svhint></div>
  <select id=pay>${Object.entries(PAY).map(([k,v])=>`<option value=${k} ${k==last.pay?'selected':''}>${v}`).join('')}</select>
  <label class=chk><input type=checkbox id=bl><span class=box></span><span>Bill attached</span></label>
  <button class=p id=ab onclick=al()>Add expense</button>
 </div>`;tg();rf()}

function openSheet(){$('#backdrop').classList.add('show');$('#sheet').classList.add('show');document.body.style.overflow='hidden'}
function closeSheet(){$('#backdrop').classList.remove('show');$('#sheet').classList.remove('show');document.body.style.overflow='';
 if(eid)cc()}

function S(k,v){cur[k]=v;if(k=='customer'&&D.cust[v]){cur.ips=D.cust[v];op(cur.id);return}
 if(k=='ips'&&cur.customer)D.cust[cur.customer]=v;persist();
 if(k=='type'){op(cur.id);return}
 if(['start','end','days'].includes(k))$('#dy').placeholder=Math.max(1,diff(cur));
 if(k=='start'){last.date=v;const dtEl=$('#dt');if(dtEl){dtEl.value=v;if(!$('#md').checked)$('#dt2').value=v}}
 rf()}
function tg(){const d=DESC.includes($('#cat').value);$('#tr').hidden=d;$('#det').hidden=!d}
function toggleMd(){const on=$('#md').checked;$('#dt2wrap').hidden=!on;if(on){if(!$('#dt2').value)$('#dt2').value=$('#dt').value}else{$('#dt2').value=$('#dt').value}}
function cc(){eid=null;op(cur.id)}
function svhint(){const a=+$('#amt').value||0,ev=$('#eff').value,e=ev===''?null:+ev,h=$('#svh');
 if(e==null||!a){h.textContent='';h.className='svhint mu';return}
 const d=Math.round((a-e)*100)/100;
 if(d>0){h.textContent=`Saved ₹${d} → goes to your personal ledger`;h.className='svhint pos'}
 else if(d<0){h.textContent=`Costs ₹${-d} more than the bill`;h.className='svhint neg'}
 else{h.textContent='No difference';h.className='svhint mu'}}

function rf(){const t=cur,c=calc(t);
 $('#sum').innerHTML=`
 <div class="cd twocol">
  <div class=main><div class=headline><span class=mu>You'll receive</span><span class=v>${inr(c.total)}</span></div>
   <div class=row><span class=mu>Excel claim</span><b>${inr(c.claim)}</b></div>
   ${t.type=='out'?`<div class=row><span class=mu>Outstation allowance (${days(t)} × ₹550)</span><b>${inr(c.allow)}</b></div>`:''}
  </div>
  <div class=tbox><div class=lbl>Personal<br>Ledger</div><div class="amt">${c.net<0?'−':'+'}${inr(Math.abs(c.net))}</div><div class=sub>${c.net<0?'costs you':'you gain'}</div></div>
 </div>
 <div class=cd>
  <div class=row><span class=mu>Cashback &amp; Returns</span><b class=pos>+${inr(c.savings)}</b></div>
  ${t.type=='out'?`<div class=row><span class=mu>Outstation allowance</span><b class=pos>+${inr(c.allow)}</b></div>`:''}
  ${c.personal?`<div class=row><span class=mu>Personal spend (not in Excel)</span><b class=neg>−${inr(c.personal)}</b></div>`:''}
 </div>
 ${c.overDays.length?`<div class=notice>⚠ Food went over the ₹300 daily cap on ${c.overDays.map(([d,v])=>`${d} (${inr(v)})`).join(', ')}. It still exports at the full amount — just flagging it.</div>`:''}`;
 $('#ls').innerHTML=c.rows.length?c.rows.map(r=>{const l=r.l,sv=lineSaved(l);
  return`<div class="rc${eid==l.id?' editing':''}" onclick="ed(${l.id})">
   <button class=kebab onclick="toggleMenu(event,${l.id})" aria-label=Options>⋮</button>
   <div class=menu id="menu-${l.id}" hidden onclick="event.stopPropagation()">
    <button onclick="ed(${l.id});closeMenus()">✎ Edit</button>
    <button class=danger onclick="dl(${l.id});closeMenus()">🗑 Delete</button>
    <button onclick="closeMenus()">✕ Cancel</button>
   </div>
   <div class=top><span class=cicon>${icon(l.cat)}</span><span class=desc>${esc(desc(l))}</span><span class=dots></span><span class=amt>${inr(l.amt)}</span></div>
   <div class=meta>${l.toDate&&l.toDate!==l.date?`${l.date} → ${l.toDate}`:l.date} · ${PAY[l.pay]}${r.bill?` · bill ${r.bill}`:''}${sv?` · saved ${inr(sv)}`:''}</div>
   ${!r.excel?`<div class=warn>${PV.includes(l.cat)?'Personal spend — in your ledger, not the Excel':'Outstation food — in your ledger, not the Excel'}</div>`:''}
  </div>`}).join(''):'<div class="cd empty">No expenses logged yet.</div>'}

function toggleMenu(e,id){e.stopPropagation();const m=$('#menu-'+id),willOpen=m.hidden;closeMenus();if(!willOpen)return;
 const r=e.currentTarget.getBoundingClientRect();
 m.style.position='fixed';m.style.left=Math.max(8,Math.min(r.right-134,window.innerWidth-142))+'px';
 // Prefer opening upward: the list is always followed by the Download button, so
 // opening downward would sit on top of it. Only open downward near the very top.
 if(r.top>170){m.style.bottom=(window.innerHeight-r.top+4)+'px';m.style.top='auto'}else{m.style.top=(r.bottom+4)+'px';m.style.bottom='auto'}
 m.hidden=false}
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.hidden=true)}
document.addEventListener('click',closeMenus);

function al(){const av=$('#amt').value,amt=av===''?0:+av;if(amt<0||isNaN(amt))return $('#amt').focus();
 const ev=$('#eff').value,eff=ev===''?null:+ev,md=$('#md').checked,toDate=md&&$('#dt2').value?$('#dt2').value:$('#dt').value;
 const l={id:eid||Date.now(),date:$('#dt').value,toDate,cat:$('#cat').value,from:$('#fr').value.trim(),to:$('#to').value.trim(),det:$('#det').value.trim(),amt,eff,pay:$('#pay').value,bill:$('#bl').checked};
 const i=cur.lines.findIndex(x=>x.id==l.id);i<0?cur.lines.push(l):cur.lines[i]=l;
 last={pay:l.pay,date:l.date};persist();
 const wasEdit=!!eid,to=l.to;eid=null;
 $('#ab').textContent='Add expense';$('#sheetTitle').textContent='Add expense';
 ['amt','eff','det','to'].forEach(k=>$('#'+k).value='');$('#fr').value=wasEdit?'':to;$('#bl').checked=false;
 $('#md').checked=false;$('#dt2wrap').hidden=true;$('#dt2').value=$('#dt').value;svhint();
 rf();if(wasEdit)closeSheet()}
function ed(id){closeMenus();const l=cur.lines.find(x=>x.id==id);eid=id;
 $('#cat').value=l.cat;tg();$('#dt').value=l.date;$('#fr').value=l.from;$('#to').value=l.to;$('#det').value=l.det;
 $('#amt').value=l.amt;$('#eff').value=l.eff!=null?l.eff:'';$('#pay').value=l.pay;$('#bl').checked=l.bill;
 const spans=l.toDate&&l.toDate!==l.date;$('#md').checked=spans;$('#dt2wrap').hidden=!spans;$('#dt2').value=l.toDate||l.date;svhint();
 $('#ab').textContent='Save changes';$('#sheetTitle').textContent='Edit expense';
 openSheet()}
function dl(id){closeMenus();if(eid==id){eid=null;closeSheetSilent()}cur.lines=cur.lines.filter(x=>x.id!=id);persist();
 rf()}
function closeSheetSilent(){$('#backdrop').classList.remove('show');$('#sheet').classList.remove('show');document.body.style.overflow='';
 $('#ab').textContent='Add expense';$('#sheetTitle').textContent='Add expense'}
function dt(){if(cur.saved===false)return discardDraft();
 if(confirm('Delete this whole visit? This cannot be undone.')){D.trips=D.trips.filter(x=>x!=cur);save();home()}}
function bk(){dw(new Blob([JSON.stringify(D)]),`te-backup-${today()}.json`)}
function rs(e){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!d.trips)throw 0;D=d;save();home()}catch{alert('That file is not a valid backup.')}})}
function dw(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}

async function xl(){const t=cur,c=calc(t),U=s=>s?new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))):null,F='d-mmm-yy';
 try{const wb=new ExcelJS.Workbook();await wb.xlsx.load(await(await fetch('TE_format.xlsx')).arrayBuffer());const ws=wb.worksheets[0];
 const rows=c.rows.filter(r=>r.excel),x=Math.max(0,rows.length-20),a=31+x;
 if(x){['C31:D31','C32:D32','C33:D33','E32:F32','E33:F33'].forEach(m=>ws.unMergeCells(m));ws.spliceRows(31,0,...Array(x).fill([]));
  for(let i=0;i<x;i++)for(let k=1;k<=6;k++)ws.getRow(31+i).getCell(k).style={...ws.getRow(30).getCell(k).style};
  [`C${a}:D${a}`,`C${a+1}:D${a+1}`,`C${a+2}:D${a+2}`,`E${a+1}:F${a+1}`,`E${a+2}:F${a+2}`].forEach(m=>ws.mergeCells(m))}
 ws.getCell('C2').value=t.dest;ws.getCell('F2').value=t.purpose;ws.getCell('C3').value=t.customer;ws.getCell('C4').value=t.ips;ws.getCell('F4').value=days(t);
 ws.getCell('C5').value=U(t.start);ws.getCell('C5').numFmt=F;ws.getCell('F5').value=U(t.end);ws.getCell('F5').numFmt=F;ws.getCell('C6').value=t.teNo.trim();
 rows.forEach((r,i)=>{const R=ws.getRow(11+i);R.getCell(1).value=U(r.l.date);R.getCell(1).numFmt=F;R.getCell(2).value=U(r.l.toDate||r.l.date);R.getCell(2).numFmt=F;R.getCell(3).value=desc(r.l);R.getCell(4).value=r.bill||null;R.getCell(6).value=r.l.amt});
 ws.getCell(`E${a}`).value={formula:`SUM(E11:E${a-1})`,result:0};ws.getCell(`F${a}`).value={formula:`SUM(F11:F${a-1})`,result:c.claim};
 ws.getCell(`E${a+1}`).value={formula:`E${a}+F${a}`,result:c.claim};ws.getCell(`E${a+2}`).value={formula:`F${a}-C7`,result:c.claim};
 wb.calcProperties.fullCalcOnLoad=true;dw(new Blob([await wb.xlsx.writeBuffer()]),`TE_${(t.customer||'trip').replace(/\W+/g,'_')}_${t.start}.xlsx`)}
 catch(e){alert('Export failed: '+e.message+'\nOpen the app once with network so the Excel library and TE_format.xlsx get cached.')}}

home();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
